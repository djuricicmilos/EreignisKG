    <link rel="canonical" href="https://www.beyng.com/sofist/" />
    <title>Sofist Application</title>
    <base href="/sofist/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />

    <script type="application/ld+json">
        {
          "@context": "https://schema.org/",

  <link href="css/waitcube.css" rel="stylesheet" />
