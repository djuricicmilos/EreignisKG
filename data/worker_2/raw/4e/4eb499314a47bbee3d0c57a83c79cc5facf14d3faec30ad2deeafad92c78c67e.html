<!DOCTYPE html>
<html ng-app="reader" style="padding:0; margin:10px; height:100%" lang="en">
<head>
    <title>Heidegger Gesamtausgabe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link data-require="bootstrap-css@*" data-semver="3.3.1" rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css" />
    <script data-require="angular.js@*" data-semver="1.3.15" src="https://code.angularjs.org/1.3.15/angular.js"></script>
    <script data-require="ui-bootstrap@*" data-semver="0.12.1" src="https://angular-ui.github.io/bootstrap/ui-bootstrap-tpls-0.12.1.min.js"></script>
    <script src="AtmpBrowser.js"></script>
</head>
<body ng-controller="ReaderController" style="padding:0; margin:0; height:100%">
    <h1>
        Heidegger Gesamtausgabe
    </h1>
    <table style="border:0; padding:0; margin:0;">
        <tr style="border:0; padding:0; margin:0">
            <td style="padding:1em;">GA</td>
            <td style="border:0; padding:0; margin:0; height:100%">
                <input type="text" ng-model="currentGa" placeholder="Go to GA volume" />
            </td>
        </tr>
        <tr style="border:0; padding:0; margin:0">
            <td>Page</td>
            <td style="border:0; padding:0; margin:0; height:100%">
                <input type="text" ng-model="currentPage" placeholder="Go to page number" />
            </td>
        </tr>
    </table>
    <!--
    <pagination ng-model="currentPage"
                total-items="lastPage"
                max-size=1
                items-per-page=1>
    </pagination>
     -->
    <table style="border:0; padding:0; margin:0; height:100%; width:100%">
        <tr style="border:0; padding:0; margin:0">
            <td style="border:0; padding:0; margin:0; height:100%">
                <iframe ng-src="{{pageUrl}}" style="border-style: none;width: 100%; height: 100%"></iframe>
            </td>
        </tr>
    </table>
</body>
</html>
